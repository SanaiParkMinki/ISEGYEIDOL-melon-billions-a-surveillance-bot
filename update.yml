name: 스냅샷 수집

on:
  schedule:
    - cron: "0 19 * * *"   # 매일 04:00 KST (19:00 UTC 전날)
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 스냅샷 수집
        run: python3 scripts/collect.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/history.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "billions-bot"
          git config user.email "billions-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "스냅샷 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
